name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check all JS/MJS
        run: |
          for f in app.js recommender.js audio.js check.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run checks + recommender unit tests
        run: node check.mjs
